name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # The windows-latest image ships Visual Studio 18 (VS 2026). node-gyp
      # only learned to parse that version string in 12.0.0, and Node 20
      # bundles 10.1.0, so @vscode/sqlite3 cannot compile from source without
      # a newer node-gyp.
      #
      # Pinned to 12 rather than latest: node-gyp 13 requires Node 22+, so it
      # installs here and then refuses to run.
      #
      # Wired in through npm_config_node_gyp rather than `npm config set
      # node_gyp`, which npm 10 rejects as an unknown option. The env var is
      # what npm's own node-gyp shim reads, on both the sh and cmd side.
      - name: Use a node-gyp that recognizes Visual Studio 2026
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install -g node-gyp@12
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Verify node-gyp override
        if: runner.os == 'Windows'
        shell: bash
        run: node "$npm_config_node_gyp" --version

      - run: npm install

      - run: npm run check-types

      - run: npm test
